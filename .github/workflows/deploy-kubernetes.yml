name: Deploy Kubernetes

on:
  workflow_run:
    workflows: ['Docker Publish']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kubernetes-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Helm chart
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Lint Helm chart
        run: helm lint ./helm/team-drops -f helm/team-drops/values-rancher.yaml

      - name: Deploy Team Drops
        run: |
          helm upgrade --install team-drops ./helm/team-drops \
            --namespace team-drops \
            -f helm/team-drops/values-rancher.yaml \
            --atomic \
            --wait \
            --timeout 10m

      - name: Show release status
        if: always()
        run: |
          helm status team-drops -n team-drops || true
          kubectl -n team-drops get pods || true
