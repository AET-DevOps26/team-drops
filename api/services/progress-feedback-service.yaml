openapi: 3.1.0
info:
  title: Progress & Feedback Service API
  version: 1.0.0
servers:
  - url: http://localhost:8083
    description: Progress-Feedback Service
security:
  - bearerAuth: []
paths:
  /api/v1/listening/generate:
    post:
      tags:
        - Progress & Feedback Service
      summary: Generate listening exercise content
      description: >
        Fetches or generates a listening comprehension exercise for the given exercise ID.
        On first call, the GenAI service generates a script, TTS audio, and multiple-choice
        questions; the result is cached per exercise ID. On subsequent calls, the cached
        script, questions, and audio are returned.
        The is_correct flag is stripped from options before returning to the client.
      operationId: generateListeningContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressListeningGenerateRequest'
      responses:
        '200':
          description: Listening exercise content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeningContentResponse'
        '400':
          $ref: '../base.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
        '502':
          description: GenAI or Learning service unavailable
      x-service: progress-feedback-service
  /api/v1/answers:
    post:
      tags:
        - Progress & Feedback Service
      summary: Submit answer
      description: >
        Submit an exercise answer. The progress-feedback backend owns scoring,
        feedback persistence, progress updates, and any internal GenAI call.
        The frontend must not call GenAI or any LLM provider directly.
      operationId: submitAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Answer submitted, scored, and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAnswerResponse'
        '400':
          $ref: '../base.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: progress-feedback-service
  /api/v1/answers/{answer_id}/feedback:
    get:
      tags:
        - Progress & Feedback Service
      summary: Get feedback for answer
      operationId: getFeedbackByAnswerId
      parameters:
        - name: answer_id
          in: path
          required: true
          description: Answer ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Feedback found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: progress-feedback-service
  /api/v1/answers/user/{user_id}:
    get:
      tags:
        - Progress & Feedback Service
      summary: Get submitted answers by user
      operationId: getAnswersByUserId
      parameters:
        - $ref: '../base.yaml#/components/parameters/UserIdPath'
        - name: plan_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Optional plan scope for language-specific progress.
        - name: target_language
          in: query
          required: false
          schema:
            type: string
          description: Optional target learning language scope.
      responses:
        '200':
          description: Submitted answers for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAnswerResponse'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: progress-feedback-service
  /api/v1/progress/user/{user_id}:
    get:
      tags:
        - Progress & Feedback Service
      summary: Get progress by user ID
      operationId: getProgressByUserId
      parameters:
        - $ref: '../base.yaml#/components/parameters/UserIdPath'
        - name: plan_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Optional plan scope for language-specific progress.
        - name: target_language
          in: query
          required: false
          schema:
            type: string
          description: Optional target learning language scope.
      responses:
        '200':
          description: User progress found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: progress-feedback-service
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProgressListeningGenerateRequest:
      type: object
      required:
        - exercise_id
        - lesson_id
      properties:
        exercise_id:
          type: integer
          format: int64
          example: 5
        lesson_id:
          type: integer
          format: int64
          example: 2
        target_language:
          type: string
          example: German
          description: Target language for the exercise. Defaults to German if omitted.
        level:
          type: string
          example: A2
          description: CEFR level. Falls back to the exercise difficulty if omitted.
    ListeningContentResponse:
      type: object
      required:
        - script
        - questions
      properties:
        script:
          type: string
          example: "Heute gehen wir in ein Café. Der Kellner fragt: Was möchten Sie trinken?"
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ProgressListeningQuestion'
        audio_b64:
          type: string
          description: Base64-encoded WAV audio of the script.
    ProgressListeningQuestion:
      type: object
      required:
        - question
        - options
      properties:
        question:
          type: string
          example: "Wo findet das Gespräch statt?"
        options:
          type: array
          items:
            $ref: '#/components/schemas/ProgressListeningOption'
        explanation:
          type: string
          example: "Der Text erwähnt ein Café."
    ProgressListeningOption:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          example: "In einem Café"
    LearningStatus:
      type: string
      enum:
        - not-started
        - ongoing
        - finished
      example: ongoing
    SubmitAnswerRequest:
      type: object
      required:
        - user_id
        - exercise_id
        - answer_text
        - client_context
      properties:
        user_id:
          type: integer
          format: int64
          example: 1
        exercise_id:
          type: integer
          format: int64
          example: 1
        answer_text:
          type: string
          minLength: 1
          example: I am a computer science student interested in backend development.
        client_context:
          $ref: '#/components/schemas/AnswerClientContext'
    AnswerClientContext:
      type: object
      required:
        - lesson_id
      properties:
        lesson_id:
          type: integer
          format: int64
          example: 1
        plan_id:
          type: integer
          format: int64
          example: 1
        target_language:
          type: string
          example: German
        level:
          type: string
          example: A2
    SubmitAnswerResponse:
      type: object
      required:
        - answer
        - exercise_status
        - lesson_progress
        - plan_progress
      properties:
        answer:
          $ref: '#/components/schemas/UserAnswerResponse'
        feedback:
          oneOf:
            - $ref: '#/components/schemas/FeedbackResponse'
            - type: 'null'
        exercise_status:
          $ref: '#/components/schemas/LearningStatus'
        lesson_progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 75
        plan_progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 48
    UserAnswerResponse:
      type: object
      required:
        - id
        - user_id
        - exercise_id
        - answer_text
        - score
        - max_score
        - is_correct
        - submitted_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        exercise_id:
          type: integer
          format: int64
          example: 1
        plan_id:
          type:
            - integer
            - 'null'
          format: int64
          example: 1
        target_language:
          type:
            - string
            - 'null'
          example: German
        answer_text:
          type: string
          example: I am a computer science student interested in backend development.
        score:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
          maximum: 100
          example: 86
        max_score:
          type: integer
          format: int32
          example: 100
        is_correct:
          type:
            - boolean
            - 'null'
          example: true
        submitted_at:
          type: string
          format: date-time
          example: '2026-05-27T21:30:00Z'
    FeedbackResponse:
      type: object
      required:
        - id
        - answer_id
        - message
        - created_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        answer_id:
          type: integer
          format: int64
          example: 1
        message:
          type: string
          example: Good structure and relevant vocabulary.
        weak_area:
          type: string
          example: specificity
        corrected_answer:
          type: string
          example: I am studying computer science, and I enjoy building backend systems.
        strengths:
          type: array
          items:
            type: string
          example:
            - Clear main idea
            - Relevant technical vocabulary
        improvements:
          type: array
          items:
            type: string
          example:
            - Add one concrete project detail
            - Use a more natural transition
        created_at:
          type: string
          format: date-time
          example: '2026-05-27T21:30:00Z'
    ProgressResponse:
      type: object
      required:
        - user_id
        - completed_exercises
        - total_exercises
        - average_score
        - recent_progress
        - recent_finished
        - top_lessons
      properties:
        user_id:
          type: integer
          format: int64
          example: 1
        completed_exercises:
          type: integer
          format: int32
          example: 4
        total_exercises:
          type: integer
          format: int32
          example: 10
        average_score:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 78
        current_plan:
          $ref: '#/components/schemas/CurrentPlanProgress'
        recent_progress:
          type: array
          items:
            $ref: '#/components/schemas/RecentProgressItem'
        recent_finished:
          type: array
          items:
            $ref: '#/components/schemas/RecentFinishedLesson'
        top_lessons:
          type: array
          items:
            $ref: '#/components/schemas/TopLesson'
    CurrentPlanProgress:
      type: object
      required:
        - id
        - title
        - language
        - progress
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Job Interview Preparation
        language:
          type: string
          example: German
        progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 45
    RecentProgressItem:
      type: object
      required:
        - plan_id
        - lesson_id
        - lesson_title
        - status
        - progress
        - last_activity_at
      properties:
        plan_id:
          type: integer
          format: int64
          example: 1
        lesson_id:
          type: integer
          format: int64
          example: 1
        lesson_title:
          type: string
          example: Self Introduction
        status:
          $ref: '#/components/schemas/LearningStatus'
        progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 75
        last_activity_at:
          type: string
          format: date-time
          example: '2026-05-27T21:30:00Z'
    RecentFinishedLesson:
      type: object
      required:
        - plan_id
        - lesson_id
        - lesson_title
        - finished_at
        - score
      properties:
        plan_id:
          type: integer
          format: int64
          example: 1
        lesson_id:
          type: integer
          format: int64
          example: 1
        lesson_title:
          type: string
          example: Education and Background
        finished_at:
          type: string
          format: date-time
          example: '2026-05-26T18:10:00Z'
        score:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 91
    TopLesson:
      type: object
      required:
        - lesson_id
        - lesson_title
        - score
      properties:
        lesson_id:
          type: integer
          format: int64
          example: 1
        lesson_title:
          type: string
          example: Education and Background
        score:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 91
