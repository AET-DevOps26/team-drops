{{- if .Values.monitoring.standalone.enabled }}
{{- if ne .Release.Namespace .Values.monitoring.standalone.namespace }}
{{- fail "monitoring.standalone.namespace must match the Helm release namespace" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-drops-prometheus
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-drops-prometheus
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-drops-prometheus
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
subjects:
  - kind: ServiceAccount
    name: team-drops-prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team-drops-prometheus
{{- end }}
