openapi: 3.1.0
info:
  title: Language Learning Platform API
  description: |
    Initial API contract for the job interview preparation scenario.

    **Naming conventions**
    - API JSON / OpenAPI: `snake_case` (e.g. `lesson_id`, `expected_answer`)
    - Java entity fields: `camelCase` (e.g. `lessonId`, `expectedAnswer`)
    - Database columns: `snake_case` via `@Column(name = ...)`

    Service ownership is indicated per-operation via `x-service`.
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: User Service
  - url: http://localhost:8082
    description: Learning Service
  - url: http://localhost:8083
    description: Progress-Feedback Service
  - url: http://localhost:8084
    description: GenAI Service
tags:
  - name: User Service
    description: User and profile APIs
    x-displayName: User Service
  - name: Learning Service
    description: Learning plan, lesson, and exercise APIs
    x-displayName: Learning Service
  - name: Progress & Feedback Service
    description: Answer submission and progress APIs
    x-displayName: Progress & Feedback Service
  - name: GenAI Service
    description: GenAI APIs
    x-displayName: GenAI Service
  - name: exercises
    x-displayName: exercises
  - name: writing
    x-displayName: writing
  - name: speaking
    x-displayName: speaking
  - name: listening
    x-displayName: listening
  - name: rag
    x-displayName: rag
  - name: ops
    x-displayName: ops
paths:
  /api/v1/genai/exercises/generate:
    post:
      tags:
        - exercises
      summary: Generate additional exercises
      description: >-
        Given a lesson topic and a set of existing exercises as style
        references, generate new exercises using AI. The AI matches the format,
        difficulty, and exercise types of the provided reference set.
      operationId: generateExercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateExercisesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateExercisesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/writing/evaluate:
    post:
      tags:
        - writing
      summary: Evaluate a written answer
      description: >-
        Evaluate a learner's written answer against the exercise's expected
        answer. Returns a numeric score (0–10) ready to store as
        UserAnswer.score, plus message and weak_area fields that map directly to
        a Feedback record. Also returns the corrected answer and a detailed
        explanation of errors.
      operationId: evaluateWriting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritingEvaluationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WritingEvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/speaking/evaluate:
    post:
      tags:
        - speaking
      summary: Evaluate a spoken answer
      description: >-
        Transcribe the learner's audio with Whisper, then evaluate the
        transcription against the expected answer using the configured LLM.
        Returns a numeric score (0–10), feedback, the corrected answer, and
        optionally a base64-encoded WAV of the corrected answer spoken aloud
        (when TTS is enabled).
      operationId: evaluateSpeaking
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_evaluateSpeaking'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakingEvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/speaking/practice:
    post:
      tags:
        - speaking
      summary: Conversational speaking practice
      description: >-
        One turn of a free-form spoken conversation with an AI character in the
        target language. The frontend maintains the conversation history and
        sends it with each request. On the final turn (end_session=true) the
        service additionally returns a list of language corrections made across
        the full session, plus a spoken audio summary.
      operationId: speakingPractice
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_speakingPractice'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakingPracticeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/listening/generate:
    post:
      tags:
        - listening
      summary: Generate a listening comprehension exercise
      description: >-
        Generate a short listening script in the target language at the
        specified CEFR level. Once the script is ready, questions and audio are
        produced concurrently: the LLM generates multiple-choice comprehension
        questions while TTS synthesises the script as spoken audio. Returns the
        script text, questions (four options each, exactly one correct), and a
        base64-encoded WAV audio of the script. TTS failure is fatal because
        listening exercises require audio.
      operationId: generateListening
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListeningGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeningGenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/rag/topics:
    get:
      tags:
        - rag
      summary: List available RAG topics
      operationId: listRagTopics
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagTopicsResponse'
      security:
        - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/rag/topics/{topic}/corpus:
    post:
      tags:
        - rag
      summary: Build or rebuild a RAG topic corpus
      description: >-
        Reads PDFs from `RAG doc DB/{topic}` and writes corpus files under `RAG
        doc DB/{topic}/corpus`.
      operationId: buildRagCorpus
      security:
        - HTTPBearer: []
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
            title: Topic
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagCorpusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-service: genai-service
  /api/v1/genai/rag/query:
    post:
      tags:
        - rag
      summary: Answer a question using a RAG topic
      description: >-
        Retrieves context from PDFs under `RAG doc DB/{topic}`. If the corpus is
        missing or stale, it is rebuilt automatically under that topic's
        `corpus` folder.
      operationId: queryRag
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
      x-service: genai-service
  /health:
    get:
      tags:
        - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/learning-plans/default:
    post:
      tags:
        - Learning Service
      summary: Create default job interview learning plan
      operationId: createDefaultLearningPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDefaultLearningPlanRequest'
      responses:
        '201':
          description: Default learning plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-service: learning-service
      security:
        - bearerAuth: []
  /api/v1/learning-plans/ai:
    post:
      tags:
        - Learning Service
      summary: Create AI-generated learning plan
      description: >
        Create and persist a complete learning plan. The learning backend owns
        AI orchestration and may call GenAI internally. The frontend must not
        call GenAI or any LLM provider directly.
      operationId: createAiLearningPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiLearningPlanRequest'
      responses:
        '201':
          description: AI learning plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-service: learning-service
      security:
        - bearerAuth: []
  /api/v1/learning-plans/user/{user_id}:
    get:
      tags:
        - Learning Service
      summary: Get learning plans by user ID
      operationId: getLearningPlansByUserId
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Learning plans found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningPlanResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: learning-service
      security:
        - bearerAuth: []
  /api/v1/lessons/{lesson_id}:
    get:
      tags:
        - Learning Service
      summary: Get lesson by ID
      operationId: getLessonById
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      responses:
        '200':
          description: Lesson found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: learning-service
      security:
        - bearerAuth: []
  /api/v1/lessons/{lesson_id}/ai-exercises:
    post:
      tags:
        - Learning Service
      summary: Generate AI exercises for lesson
      description: >
        Generate and persist exercises for an existing lesson. The learning
        backend loads lesson context and calls GenAI internally if needed.
      operationId: generateAiExercisesForLesson
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAiExercisesRequest'
      responses:
        '201':
          description: AI exercises generated and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAiExercisesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: learning-service
      security:
        - bearerAuth: []
  /api/v1/listening/generate:
    post:
      tags:
        - Progress & Feedback Service
      summary: Generate listening exercise content
      description: >
        Fetches or generates a listening comprehension exercise for the given
        exercise ID. On first call, the GenAI service generates a script, TTS
        audio, and multiple-choice questions; the result is cached per exercise
        ID. On subsequent calls, the cached script, questions, and audio are
        returned. The is_correct flag is stripped from options before returning
        to the client.
      operationId: generateListeningContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressListeningGenerateRequest'
      responses:
        '200':
          description: Listening exercise content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeningContentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: GenAI or Learning service unavailable
      x-service: progress-feedback-service
      security:
        - bearerAuth: []
  /api/v1/answers:
    post:
      tags:
        - Progress & Feedback Service
      summary: Submit answer
      description: >
        Submit an exercise answer. The progress-feedback backend owns scoring,
        feedback persistence, progress updates, and any internal GenAI call. The
        frontend must not call GenAI or any LLM provider directly.
      operationId: submitAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Answer submitted, scored, and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: progress-feedback-service
      security:
        - bearerAuth: []
  /api/v1/answers/speaking:
    post:
      tags:
        - Progress & Feedback Service
      summary: Submit speaking answer
      description: >
        Submit spoken audio for an exercise. The progress-feedback backend owns
        validation, exercise lookup, internal GenAI speaking evaluation,
        feedback persistence, progress updates, and response mapping.
      operationId: submitSpeakingAnswer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
                - user_id
                - exercise_id
                - lesson_id
              properties:
                audio:
                  type: string
                  format: binary
                  description: Spoken answer audio.
                user_id:
                  type: integer
                  format: int64
                  example: 1
                exercise_id:
                  type: integer
                  format: int64
                  example: 1
                lesson_id:
                  type: integer
                  format: int64
                  example: 1
                plan_id:
                  type: integer
                  format: int64
                  example: 1
                target_language:
                  type: string
                  example: German
                level:
                  type: string
                  example: A2
      responses:
        '200':
          description: Speaking answer submitted, evaluated, and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitSpeakingAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Audio payload is too large
        '502':
          description: GenAI speaking evaluation failed
      x-service: progress-feedback-service
      security:
        - bearerAuth: []
  /api/v1/answers/{answer_id}/feedback:
    get:
      tags:
        - Progress & Feedback Service
      summary: Get feedback for answer
      operationId: getFeedbackByAnswerId
      parameters:
        - name: answer_id
          in: path
          required: true
          description: Answer ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Feedback found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: progress-feedback-service
      security:
        - bearerAuth: []
  /api/v1/answers/user/{user_id}:
    get:
      tags:
        - Progress & Feedback Service
      summary: Get submitted answers by user
      operationId: getAnswersByUserId
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Submitted answers for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAnswerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: progress-feedback-service
      security:
        - bearerAuth: []
  /api/v1/progress/user/{user_id}:
    get:
      tags:
        - Progress & Feedback Service
      summary: Get progress by user ID
      operationId: getProgressByUserId
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User progress found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: progress-feedback-service
      security:
        - bearerAuth: []
  /api/v1/users/me:
    get:
      tags:
        - User Service
      summary: Get or create current OIDC user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user found or created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-service: user-service
      security:
        - bearerAuth: []
  /api/v1/users/{user_id}:
    get:
      tags:
        - User Service
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: user-service
      security:
        - bearerAuth: []
  /api/v1/users/{user_id}/profile:
    put:
      tags:
        - User Service
      summary: Create or update user profile
      operationId: upsertUserProfile
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserProfileRequest'
      responses:
        '200':
          description: User profile saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: user-service
      security:
        - bearerAuth: []
    post:
      tags:
        - User Service
      summary: Create user profile
      operationId: createUserProfile
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
      responses:
        '201':
          description: User profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: user-service
      security:
        - bearerAuth: []
    get:
      tags:
        - User Service
      summary: Get user profile
      operationId: getUserProfile
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: user-service
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    HTTPBearer:
      type: http
      scheme: bearer
  parameters:
    UserIdPath:
      name: user_id
      in: path
      required: true
      description: User ID
      schema:
        type: integer
        format: int64
    LessonIdPath:
      name: lesson_id
      in: path
      required: true
      description: Lesson ID
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required or the provided token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request data
        details:
          type: string
          example: email must be valid
    Body_evaluateSpeaking:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
          description: Audio recording of the learner's answer (WAV, MP3, WebM, etc.)
        exercise_type:
          type: string
          title: Exercise Type
          examples:
            - translation
        question:
          type: string
          title: Question
          examples:
            - 'Translate: ''The cat is on the table'''
        expected_answer:
          type: string
          title: Expected Answer
          examples:
            - Die Katze ist auf dem Tisch
        target_language:
          type: string
          title: Target Language
          examples:
            - German
        level:
          type: string
          title: Level
          examples:
            - A2
      type: object
      required:
        - audio
        - exercise_type
        - question
        - expected_answer
        - target_language
        - level
      title: Body_evaluateSpeaking
    Body_speakingPractice:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
          description: Audio of the learner's spoken turn
        scenario:
          type: string
          title: Scenario
          examples:
            - waiter at a German restaurant
        target_language:
          type: string
          title: Target Language
          examples:
            - German
        level:
          type: string
          title: Level
          examples:
            - A2
        history_json:
          type: string
          title: History Json
          description: >-
            JSON-serialised list of ConversationMessage objects from previous
            turns
          default: '[]'
        end_session:
          type: boolean
          title: End Session
          description: Set to true on the final turn to trigger end-of-session corrections
          default: false
      type: object
      required:
        - audio
        - scenario
        - target_language
        - level
      title: Body_speakingPractice
    ExerciseContext:
      properties:
        type:
          type: string
          title: Type
          description: >-
            Exercise type, e.g. 'translation', 'fill-in-the-blank',
            'multiple-choice'
          examples:
            - translation
        question:
          type: string
          title: Question
          description: The exercise prompt shown to the learner
          examples:
            - 'Translate: ''The cat is on the table'''
        difficulty:
          type: string
          title: Difficulty
          examples:
            - beginner
        expected_answer:
          anyOf:
            - type: string
            - type: 'null'
          title: Expected Answer
          examples:
            - Die Katze ist auf dem Tisch
      type: object
      required:
        - type
        - question
        - difficulty
      title: ExerciseContext
      description: An existing exercise provided as a style/difficulty reference.
    GenerateExercisesRequest:
      properties:
        lesson_id:
          type: integer
          title: Lesson Id
          description: >-
            ID of the lesson these exercises belong to — passed through to each
            generated exercise
          examples:
            - 3
        lesson_topic:
          type: string
          title: Lesson Topic
          description: Topic or theme of the lesson
          examples:
            - Everyday household items
        target_language:
          type: string
          title: Target Language
          description: Language being learned (full name or BCP-47 tag)
          examples:
            - German
        level:
          type: string
          title: Level
          description: CEFR level or descriptive level of the learner
          examples:
            - A2
        existing_exercises:
          items:
            $ref: '#/components/schemas/ExerciseContext'
          type: array
          maxItems: 5
          minItems: 1
          title: Existing Exercises
          description: 1–5 existing exercises to use as style and difficulty references
        count:
          type: integer
          maximum: 10
          minimum: 1
          title: Count
          description: Number of new exercises to generate
          default: 3
          examples:
            - 3
      type: object
      required:
        - lesson_id
