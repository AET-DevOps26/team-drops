genai:
  llmProvider: openai
  llmModel: openai/gpt-oss-120b
  llmBaseUrl: https://logos.aet.cit.tum.de/v1
  ragLearningPlanMaxRepairAttempts: 2
  sttProvider: local
  whisperModel: /opt/models/faster-whisper-tiny
  prewarmModels: true
  # Spoken feedback is optional. Keep it disabled until Kokoro model files are
  # bundled or mounted; otherwise the first evaluation downloads ~300 MB.
  ttsEnabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

monitoring:
  rancherServiceMonitors:
    enabled: false

auth:
  issuerUri: https://team-drops.stud.k8s.aet.cit.tum.de/realms/team-drops
  jwksUri: http://keycloak:8080/realms/team-drops/protocol/openid-connect/certs

keycloak:
  redirectUris:
    - https://team-drops.stud.k8s.aet.cit.tum.de/*
  webOrigins:
    - https://team-drops.stud.k8s.aet.cit.tum.de
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

frontend:
  keycloakUrl: https://team-drops.stud.k8s.aet.cit.tum.de
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 96Mi

services:
  user:
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 150m
        memory: 320Mi
  learning:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
  progress:
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 300m
        memory: 320Mi

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 192Mi

mongo:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 192Mi

ingress:
  host: team-drops.stud.k8s.aet.cit.tum.de
  tls:
    enabled: true
    secretName: team-drops-tls
    clusterIssuer: letsencrypt-prod
