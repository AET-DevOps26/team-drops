name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  openapi-lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli lint --config api/redocly.yaml api/openapi.yaml

  build-backend-services:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: openapi-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle wrappers executable
        run: |
          chmod +x backend/user-service/gradlew
          chmod +x backend/learning-service/gradlew
          chmod +x backend/progress-feedback-service/gradlew

      - name: Build user-service without tests
        working-directory: backend/user-service
        run: ./gradlew build -x test

      - name: Build learning-service without tests
        working-directory: backend/learning-service
        run: ./gradlew build -x test

      - name: Build progress-feedback-service without tests
        working-directory: backend/progress-feedback-service
        run: ./gradlew build -x test

  test-backend-services:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle wrappers executable
        run: |
          chmod +x backend/user-service/gradlew
          chmod +x backend/learning-service/gradlew
          chmod +x backend/progress-feedback-service/gradlew

      - name: Verify Docker for PostgreSQL E2E tests
        run: docker info

      - name: Test user-service
        working-directory: backend/user-service
        run: ./gradlew test

      - name: Test learning-service
        working-directory: backend/learning-service
        run: ./gradlew test

      - name: Test progress-feedback-service
        working-directory: backend/progress-feedback-service
        run: ./gradlew test

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/*-service/build/reports/tests/test/
          if-no-files-found: error

  build-docker-images:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-backend-services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build user-service Docker image
        run: docker build -t user-service -f backend/user-service/Dockerfile .

      - name: Build learning-service Docker image
        run: docker build -t learning-service -f backend/learning-service/Dockerfile .

      - name: Build progress-feedback-service Docker image
        run: docker build -t progress-feedback-service -f backend/progress-feedback-service/Dockerfile .
