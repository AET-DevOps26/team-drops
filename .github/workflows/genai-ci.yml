name: GenAI CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'genai/**'
      - 'api/**'
      - '!**/*.md'

  push:
    branches: [main]
    paths:
      - 'genai/**'
      - 'api/**'
      - '!**/*.md'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: genai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v

  sync-openapi:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install GenAI dependencies
        working-directory: genai
        run: uv sync

      - name: Export GenAI spec and rebuild central spec
        run: bash api/scripts/export_openapi.sh

      - name: Fail if GenAI spec is out of sync
        run: |
          git diff --exit-code api/services/genai.yaml || \
            (echo "ERROR: api/services/genai.yaml is stale. Run: bash api/scripts/export_openapi.sh and commit the result." && exit 1)

      - name: Fail if central spec is out of sync
        run: |
          git diff --exit-code api/openapi.yaml || \
            (echo "ERROR: api/openapi.yaml is stale. Run: bash api/scripts/export_openapi.sh and commit the result." && exit 1)

      - name: Lint central OpenAPI spec
        run: npx --yes @redocly/cli lint api/openapi.yaml --config api/redocly.yaml

  build-docker-image:
    runs-on: ubuntu-latest
    needs:
      - test
      - sync-openapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t genai-service ./genai

  push-docker-image:
    runs-on: ubuntu-latest
    needs: build-docker-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./genai
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/genai-service:sha-${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/genai-service:latest