name: Deploy Kubernetes

on:
  workflow_run:
    workflows: ['Docker Publish']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: deploy-kubernetes-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Helm chart
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Resolve image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Helm dependencies
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm dependency build ./helm/team-drops

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Lint Helm chart
        run: |
          helm lint ./helm/team-drops \
            --namespace team-drops \
            -f helm/team-drops/values-rancher.yaml \
            --set genai.llmApiKey=dummy \
            --set monitoring.standalone.grafanaAdminPassword=dummy

      - name: Render Helm chart
        run: |
          helm template team-drops ./helm/team-drops \
            --namespace team-drops \
            -f helm/team-drops/values-rancher.yaml \
            --set image.tag="${{ steps.image-tag.outputs.value }}" \
            --set genai.llmApiKey="${{ secrets.LLM_API_KEY }}" \
            --set monitoring.standalone.grafanaAdminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            > /tmp/team-drops-rendered.yaml

      - name: Validate rendered Kubernetes manifests
        run: |
          ruby -ryaml -e '
            failures = []

            YAML.load_stream(File.read("/tmp/team-drops-rendered.yaml")).compact.each do |doc|
              next unless ["Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"].include?(doc["kind"])

              pod_spec =
                if doc["kind"] == "CronJob"
                  doc.dig("spec", "jobTemplate", "spec", "template", "spec")
                else
                  doc.dig("spec", "template", "spec")
                end

              next unless pod_spec

              containers = pod_spec.fetch("initContainers", []) + pod_spec.fetch("containers", [])
              containers.each do |container|
                container.fetch("env", []).each_with_index do |env, index|
                  next unless env.key?("value") && env.key?("valueFrom")

                  failures << "#{doc["kind"]}/#{doc.dig("metadata", "name")} #{container["name"]} env[#{index}] #{env["name"]}"
                end
              end
            end

            unless failures.empty?
              abort("Rendered env vars define both value and valueFrom:\n- #{failures.join("\n- ")}")
            end

            documents = YAML.load_stream(File.read("/tmp/team-drops-rendered.yaml")).compact
            services = documents.select { |doc| doc["kind"] == "Service" }
            service_monitors = documents.select { |doc| doc["kind"] == "ServiceMonitor" }
            expected_paths = {
              "user-service" => "/actuator/prometheus",
              "learning-service" => "/actuator/prometheus",
              "progress-feedback-service" => "/actuator/prometheus",
              "genai-service" => "/metrics"
            }

            expected_paths.each do |name, path|
              service = services.find { |doc| doc.dig("metadata", "name") == name }
              abort("Missing Service/#{name}") unless service
              abort("Service/#{name} does not expose named port http") unless service.dig("spec", "ports").any? { |port| port["name"] == "http" }
              abort("Service/#{name} is missing monitoring label") unless service.dig("metadata", "labels", "monitoring") == "true"
              abort("Service/#{name} has the wrong Prometheus path") unless service.dig("metadata", "annotations", "prometheus.io/path") == path
            end

            abort("Rancher ServiceMonitors must be disabled for the standalone stack") unless service_monitors.empty?
            cluster_scoped_rbac = documents.select { |doc| ["ClusterRole", "ClusterRoleBinding"].include?(doc["kind"]) }
            abort("Standalone monitoring rendered cluster-scoped RBAC") unless cluster_scoped_rbac.empty?
            pvcs = documents.select { |doc| doc["kind"] == "PersistentVolumeClaim" }.map { |doc| doc.dig("metadata", "name") }
            abort("Missing Prometheus PVC") unless pvcs.any? { |name| name.include?("prometheus") }
            abort("Missing Grafana PVC") unless pvcs.any? { |name| name.include?("grafana") }
            abort("Missing namespace-scoped Prometheus Role") unless documents.any? { |doc| doc["kind"] == "Role" && doc.dig("metadata", "name") == "team-drops-prometheus" }
          '

      - name: Deploy Team Drops
        run: |
          helm upgrade --install team-drops ./helm/team-drops \
            --namespace team-drops \
            -f helm/team-drops/values-rancher.yaml \
            --set image.tag="${{ steps.image-tag.outputs.value }}" \
            --set genai.llmApiKey="${{ secrets.LLM_API_KEY }}" \
            --set monitoring.standalone.grafanaAdminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --force-conflicts \
            --wait \
            --timeout 10m

      - name: Show release status
        if: always()
        run: |
          helm status team-drops -n team-drops || true
          kubectl -n team-drops get pods || true
          kubectl -n team-drops get deployments || true
          kubectl -n team-drops get replicasets || true
          kubectl -n team-drops describe deployment genai-service || true
          kubectl -n team-drops describe deployment keycloak || true
          kubectl -n team-drops get events --sort-by=.lastTimestamp || true
          kubectl -n team-drops get pods,svc,pvc | grep -E 'prometheus|grafana' || true
          kubectl -n team-drops get role,rolebinding team-drops-prometheus || true
          kubectl -n team-drops get deployment frontend -o=jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true
