apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-drops.labels" . | nindent 8 }}
        {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "frontend") | nindent 8 }}
    spec:
      {{- include "team-drops.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "team-drops.image" (dict "root" . "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: frontend
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: frontend
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: frontend
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
