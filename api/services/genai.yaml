openapi: 3.1.0
info:
  title: GenAI Language Learning Service
  description: 'LLM-powered microservice for the language learning platform. Provides
    exercise generation, writing evaluation, and speaking practice via LangChain with
    configurable backends (Ollama or OpenAI). All routes are prefixed with `/api/v1/genai/`.


    Interactive docs: `/docs` — Alternative docs: `/redoc`'
  version: 0.1.0
servers:
- url: http://localhost:8084
  description: GenAI Service (local)
paths:
  /api/v1/genai/exercises/generate:
    post:
      tags:
      - exercises
      summary: Generate additional exercises
      description: Given a lesson topic and a set of existing exercises as style references,
        generate new exercises using AI. The AI matches the format, difficulty, and
        exercise types of the provided reference set.
      operationId: generateExercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateExercisesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateExercisesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/writing/evaluate:
    post:
      tags:
      - writing
      summary: Evaluate a written answer
      description: Evaluate a learner's written answer against the exercise's expected
        answer. Returns a numeric score (0–10) ready to store as UserAnswer.score,
        plus message and weak_area fields that map directly to a Feedback record.
        Also returns the corrected answer and a detailed explanation of errors.
      operationId: evaluateWriting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritingEvaluationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WritingEvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/speaking/evaluate:
    post:
      tags:
      - speaking
      summary: Evaluate a spoken answer
      description: Transcribe the learner's audio with Whisper, then evaluate the
        transcription against the expected answer using the configured LLM. Returns
        a numeric score (0–10), feedback, the corrected answer, and optionally a base64-encoded
        WAV of the corrected answer spoken aloud (when TTS is enabled).
      operationId: evaluateSpeaking
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_evaluateSpeaking'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakingEvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/speaking/practice:
    post:
      tags:
      - speaking
      summary: Conversational speaking practice
      description: One turn of a free-form spoken conversation with an AI character
        in the target language. The frontend maintains the conversation history and
        sends it with each request. On the final turn (end_session=true) the service
        additionally returns a list of language corrections made across the full session,
        plus a spoken audio summary.
      operationId: speakingPractice
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_speakingPractice'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakingPracticeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/listening/generate:
    post:
      tags:
      - listening
      summary: Generate a listening comprehension exercise
      description: 'Generate a short listening script in the target language at the
        specified CEFR level. Once the script is ready, questions and audio are produced
        concurrently: the LLM generates multiple-choice comprehension questions while
        TTS synthesises the script as spoken audio. Returns the script text, questions
        (four options each, exactly one correct), and a base64-encoded WAV audio of
        the script. TTS failure is fatal because listening exercises require audio.'
      operationId: generateListening
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListeningGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeningGenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/rag/topics:
    get:
      tags:
      - rag
      summary: List available RAG topics
      operationId: listRagTopics
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagTopicsResponse'
      security:
      - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/rag/topics/{topic}/corpus:
    post:
      tags:
      - rag
      summary: Build or rebuild a RAG topic corpus
      description: Reads PDFs from `RAG doc DB/{topic}` and writes corpus files under
        `RAG doc DB/{topic}/corpus`.
      operationId: buildRagCorpus
      security:
      - HTTPBearer: []
      parameters:
      - name: topic
        in: path
        required: true
        schema:
          type: string
          title: Topic
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagCorpusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-service: genai-service
  /api/v1/genai/rag/query:
    post:
      tags:
      - rag
      summary: Answer a question using a RAG topic
      description: Retrieves context from PDFs under `RAG doc DB/{topic}`. If the
        corpus is missing or stale, it is rebuilt automatically under that topic's
        `corpus` folder.
      operationId: queryRag
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      x-service: genai-service
  /api/v1/genai/rag/learning-plan:
    post:
      tags:
      - rag
      summary: Generate a structured learning plan from a RAG topic
      description: Retrieves topic context from the local RAG corpus and asks the
        configured LLM for a schema-validated learning plan that learning-service
        can persist.
      operationId: generateRagLearningPlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagLearningPlanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagLearningPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      x-service: genai-service
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_evaluateSpeaking:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
          description: Audio recording of the learner's answer (WAV, MP3, WebM, etc.)
        exercise_type:
          type: string
          title: Exercise Type
          examples:
          - translation
        question:
          type: string
          title: Question
          examples:
          - 'Translate: ''The cat is on the table'''
        expected_answer:
          type: string
          title: Expected Answer
          examples:
          - Die Katze ist auf dem Tisch
        target_language:
          type: string
          title: Target Language
          examples:
          - German
        level:
          type: string
          title: Level
          examples:
          - A2
      type: object
      required:
      - audio
      - exercise_type
      - question
      - expected_answer
      - target_language
      - level
      title: Body_evaluateSpeaking
    Body_speakingPractice:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
          description: Audio of the learner's spoken turn
        scenario:
          type: string
          title: Scenario
          examples:
          - waiter at a German restaurant
        target_language:
          type: string
          title: Target Language
          examples:
          - German
        level:
          type: string
          title: Level
          examples:
          - A2
        history_json:
          type: string
          title: History Json
          description: JSON-serialised list of ConversationMessage objects from previous
            turns
          default: '[]'
        end_session:
          type: boolean
          title: End Session
          description: Set to true on the final turn to trigger end-of-session corrections
          default: false
      type: object
      required:
      - audio
      - scenario
      - target_language
      - level
      title: Body_speakingPractice
    ExerciseContext:
      properties:
        type:
          type: string
          title: Type
          description: Exercise type, e.g. 'translation', 'fill-in-the-blank', 'multiple-choice'
          examples:
          - translation
        question:
          type: string
          title: Question
          description: The exercise prompt shown to the learner
          examples:
          - 'Translate: ''The cat is on the table'''
        difficulty:
          type: string
          title: Difficulty
          examples:
          - beginner
        expected_answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Answer
          examples:
          - Die Katze ist auf dem Tisch
      type: object
      required:
      - type
      - question
      - difficulty
      title: ExerciseContext
      description: An existing exercise provided as a style/difficulty reference.
    GenerateExercisesRequest:
      properties:
        lesson_id:
          type: integer
          title: Lesson Id
          description: ID of the lesson these exercises belong to — passed through
            to each generated exercise
          examples:
          - 3
        lesson_topic:
          type: string
          title: Lesson Topic
          description: Topic or theme of the lesson
          examples:
          - Everyday household items
        target_language:
          type: string
          title: Target Language
          description: Language being learned (full name or BCP-47 tag)
          examples:
          - German
        level:
          type: string
          title: Level
          description: CEFR level or descriptive level of the learner
          examples:
          - A2
        existing_exercises:
          items:
            $ref: '#/components/schemas/ExerciseContext'
          type: array
          maxItems: 5
          minItems: 1
          title: Existing Exercises
          description: 1–5 existing exercises to use as style and difficulty references
        count:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Count
          description: Number of new exercises to generate
          default: 3
          examples:
          - 3
      type: object
      required:
      - lesson_id
      - lesson_topic
      - target_language
      - level
      - existing_exercises
      title: GenerateExercisesRequest
      description: 'Request body for generating additional exercises similar to existing
        ones.

        Provide 1–5 existing exercises as style references — the AI will match their

        format, difficulty, and language level when creating new ones.'
    GenerateExercisesResponse:
      properties:
        exercises:
          items:
            $ref: '#/components/schemas/GeneratedExercise'
          type: array
          title: Exercises
          description: Newly generated exercises in the same style as the provided
            examples
      type: object
      required:
      - exercises
      title: GenerateExercisesResponse
      description: 'Response body containing newly generated exercises.

        Each exercise matches the style and difficulty of the provided reference set.'
    GeneratedExercise:
      properties:
        lesson_id:
          type: integer
          title: Lesson Id
          description: Lesson this exercise belongs to — passed through from the request
        type:
          type: string
          enum:
          - translation
          - fill-in-the-blank
          - multiple-choice
          - sentence-building
          title: Type
          description: Exercise type — maps to Exercise.type
        question:
          type: string
          title: Question
          description: The exercise prompt — maps to Exercise.question
        difficulty:
          type: string
          title: Difficulty
          description: Difficulty level — maps to Exercise.difficulty
        expected_answer:
          type: string
          title: Expected Answer
          description: The correct answer — maps to Exercise.expectedAnswer
      type: object
      required:
      - lesson_id
      - type
      - question
      - difficulty
      - expected_answer
      title: GeneratedExercise
      description: A single AI-generated exercise. All fields map directly to Exercise
        in the backend.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ListeningGenerateRequest:
      properties:
        target_language:
          type: string
          title: Target Language
          description: Language the script and questions will be written in
          examples:
          - German
        level:
          type: string
          enum:
          - A1
          - A2
          - B1
          - B2
          - C1
          - C2
          title: Level
          description: CEFR level of the learner — controls script vocabulary and
            grammar complexity
          examples:
          - B1
        topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Topic
          description: Optional topic hint for the script (e.g. 'job interview', 'travel').
            Defaults to everyday life when omitted.
          examples:
          - job interview
      type: object
      required:
      - target_language
      - level
      title: ListeningGenerateRequest
    ListeningGenerateResponse:
      properties:
        script:
          type: string
          title: Script
          description: The listening passage in the target language
        questions:
          items:
            $ref: '#/components/schemas/ListeningQuestion'
          type: array
          minItems: 1
          title: Questions
          description: Multiple-choice comprehension questions about the script
        script_audio_b64:
          type: string
          title: Script Audio B64
          description: Base64-encoded WAV of the script spoken aloud
      type: object
      required:
      - script
      - questions
      - script_audio_b64
      title: ListeningGenerateResponse
    ListeningOption:
      properties:
        text:
          type: string
          title: Text
          description: The option text shown to the learner
          examples:
          - Im Park
        is_correct:
          type: boolean
          title: Is Correct
          description: True if this is the correct answer — exactly one option per
            question is true
      type: object
      required:
      - text
      - is_correct
      title: ListeningOption
    ListeningQuestion:
      properties:
        question:
          type: string
          title: Question
          description: The question text in the target language
          examples:
          - Wo treffen sich die zwei Freunde?
        options:
          items:
            $ref: '#/components/schemas/ListeningOption'
          type: array
          maxItems: 4
          minItems: 4
          title: Options
          description: Exactly four answer options — exactly one must have is_correct=true
        explanation:
          type: string
          title: Explanation
          description: Why the correct answer is right — shown after the learner submits
          examples:
          - The text says 'treffen sich im Park', which means 'they meet in the park'.
      type: object
      required:
      - question
      - options
      - explanation
      title: ListeningQuestion
    RagCorpusResponse:
      properties:
        topic:
          type: string
          title: Topic
        pdf_count:
          type: integer
          title: Pdf Count
        chunk_count:
          type: integer
          title: Chunk Count
        corpus_dir:
          type: string
          title: Corpus Dir
      type: object
      required:
      - topic
      - pdf_count
      - chunk_count
      - corpus_dir
      title: RagCorpusResponse
    RagLearningPlanExercise:
      properties:
        type:
          type: string
          title: Type
          description: Learning-service ExerciseType enum value
        subtype:
          type: string
          title: Subtype
          description: Learning-service ExerciseSubtype enum value
        question:
          type: string
          title: Question
        expected_answer:
          type: string
          title: Expected Answer
        difficulty:
          type: string
          title: Difficulty
      type: object
      required:
      - type
      - subtype
      - question
      - expected_answer
      - difficulty
      title: RagLearningPlanExercise
    RagLearningPlanLesson:
      properties:
        title:
          type: string
          title: Title
        topic:
          type: string
          title: Topic
        summary:
          type: string
          title: Summary
        order_number:
          type: integer
          minimum: 1.0
          title: Order Number
        content_blocks:
          items:
            type: string
          type: array
          title: Content Blocks
        exercises:
          items:
            $ref: '#/components/schemas/RagLearningPlanExercise'
          type: array
          minItems: 1
          title: Exercises
      type: object
      required:
      - title
      - topic
      - summary
      - order_number
      - exercises
      title: RagLearningPlanLesson
    RagLearningPlanRequest:
      properties:
        topic:
          type: string
          title: Topic
          description: Folder name under RAG doc DB used as the grounding corpus
          examples:
          - job interview
        learning_goal:
          type: string
          minLength: 1
          title: Learning Goal
          description: Learner's goal for the generated learning plan
          examples:
          - Prepare for a German job interview
        target_language:
          type: string
          minLength: 1
          title: Target Language
          description: Language the plan should teach and use for learner-facing content
          examples:
          - German
        level:
          type: string
          enum:
          - A1
          - A2
          - B1
          - B2
          - C1
          - C2
          title: Level
          description: Learner CEFR level
          examples:
          - B1
        duration_weeks:
          type: integer
          maximum: 52.0
          minimum: 1.0
          title: Duration Weeks
        study_hours_per_week:
          type: integer
          maximum: 80.0
          minimum: 1.0
          title: Study Hours Per Week
        minimum_lessons:
          type: integer
          maximum: 24.0
          minimum: 1.0
          title: Minimum Lessons
        maximum_lessons:
          type: integer
          maximum: 24.0
          minimum: 1.0
          title: Maximum Lessons
        exercise_types:
          items:
            type: string
          type: array
          minItems: 1
          title: Exercise Types
          description: Learning-service-compatible exercise type names to include
          examples:
          - - writing
            - speaking
        top_k:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Top K
          default: 6
        rebuild_corpus:
          type: boolean
          title: Rebuild Corpus
          default: false
      type: object
      required:
      - topic
      - learning_goal
      - target_language
      - level
      - duration_weeks
      - study_hours_per_week
      - minimum_lessons
      - maximum_lessons
      - exercise_types
      title: RagLearningPlanRequest
    RagLearningPlanResponse:
      properties:
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        goal:
          type: string
          title: Goal
        language:
          type: string
          title: Language
        level:
          type: string
          title: Level
        duration:
          type: string
          title: Duration
        lessons:
          items:
            $ref: '#/components/schemas/RagLearningPlanLesson'
          type: array
          minItems: 1
          title: Lessons
        sources:
          items:
            $ref: '#/components/schemas/RagSource'
          type: array
          title: Sources
      type: object
      required:
      - title
      - description
      - goal
      - language
      - level
      - duration
      - lessons
      title: RagLearningPlanResponse
    RagQueryRequest:
      properties:
        topic:
          type: string
          title: Topic
          description: Folder name under RAG doc DB, e.g. 'job interview'
          examples:
          - job interview
        question:
          type: string
          minLength: 1
          title: Question
          description: Question to answer from the topic corpus
          examples:
          - How should I answer behavioral interview questions?
        top_k:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Top K
          description: Number of retrieved chunks to pass to the LLM
          default: 5
        rebuild_corpus:
          type: boolean
          title: Rebuild Corpus
          description: Force rebuilding corpus files before retrieval
          default: false
      type: object
      required:
      - topic
      - question
      title: RagQueryRequest
    RagQueryResponse:
      properties:
        topic:
          type: string
          title: Topic
        question:
          type: string
          title: Question
        answer:
          type: string
          title: Answer
        sources:
          items:
            $ref: '#/components/schemas/RagSource'
          type: array
          title: Sources
      type: object
      required:
      - topic
      - question
      - answer
      - sources
      title: RagQueryResponse
    RagSource:
      properties:
        source:
          type: string
          title: Source
        page:
          type: integer
          title: Page
        chunk_index:
          type: integer
          title: Chunk Index
        score:
          type: number
          title: Score
        text:
          type: string
          title: Text
      type: object
      required:
      - source
      - page
      - chunk_index
      - score
      - text
      title: RagSource
    RagTopicsResponse:
      properties:
        topics:
          items:
            type: string
          type: array
          title: Topics
      type: object
      required:
      - topics
      title: RagTopicsResponse
    SpeakingEvaluationResponse:
      properties:
        transcription:
          type: string
          title: Transcription
          description: Speech-to-text transcription of the learner's audio
          examples:
          - Die Katze ist an den Tisch
        score:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Score
          description: Numeric score 0–10 — maps to UserAnswer.score
          examples:
          - 6.5
        is_correct:
          type: boolean
          title: Is Correct
          description: True if the spoken answer is substantially correct
        message:
          type: string
          title: Message
          description: Full feedback covering what was wrong and why — maps to Feedback.message.
            Should be a complete, helpful explanation suitable for storing as the
            feedback record.
          examples:
          - 'Good attempt! You used ''an'' (contact/vertical surface) instead of ''auf''
            (horizontal surface). Also check the case: ''Tisch'' requires the dative
            ''dem'' here.'
        weak_area:
          type: string
          title: Weak Area
          description: Short category to improve — maps to Feedback.weakArea
          examples:
          - preposition usage
        corrected_answer:
          type: string
          title: Corrected Answer
          description: The corrected version of the learner's answer — for frontend
            display
          examples:
          - Die Katze ist auf dem Tisch
        feedback_audio_b64:
          anyOf:
          - type: string
          - type: 'null'
          title: Feedback Audio B64
          description: Base64-encoded WAV audio of corrected_answer spoken aloud (null
            when TTS is disabled)
      type: object
      required:
      - transcription
      - score
      - is_correct
      - message
      - weak_area
      - corrected_answer
      title: SpeakingEvaluationResponse
      description: 'AI evaluation of a spoken answer.

        score and feedback fields mirror WritingEvaluationResponse so both map to

        the same UserAnswer + Feedback domain objects in the backend.

        transcription is the raw Whisper output — useful for displaying what was heard.

        feedback_audio_b64 is a base64-encoded WAV of the corrected answer spoken
        aloud

        (only present when TTS is enabled).'
    SpeakingPracticeResponse:
      properties:
        transcription:
          type: string
          title: Transcription
          description: Whisper transcription of the learner's audio for this turn
        ai_response_text:
          type: string
          title: Ai Response Text
          description: AI character's reply in the target language
        ai_response_audio_b64:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Response Audio B64
          description: Base64-encoded WAV of the AI's reply spoken aloud
        session_corrections:
          anyOf:
          - items:
              $ref: '#/components/schemas/TurnCorrection'
            type: array
          - type: 'null'
          title: Session Corrections
          description: Language errors found across the full session — only present
            on the final turn
        corrections_audio_b64:
          anyOf:
          - type: string
          - type: 'null'
          title: Corrections Audio B64
          description: Base64-encoded WAV of the corrections summary spoken aloud
            — only on the final turn
      type: object
      required:
      - transcription
      - ai_response_text
      title: SpeakingPracticeResponse
      description: 'Response for one turn of a speaking practice conversation.

        On normal turns only transcription + AI reply are populated.

        On the final turn (end_session=true) session_corrections and corrections_audio_b64

        are also populated.'
    TurnCorrection:
      properties:
        original:
          type: string
          title: Original
          description: What the learner actually said
          examples:
          - Ich möchte ein Kaffee
        corrected:
          type: string
          title: Corrected
          description: What they should have said
          examples:
          - Ich möchte einen Kaffee
        explanation:
          type: string
          title: Explanation
          description: Short grammar or vocabulary note
          examples:
          - '''Kaffee'' is masculine, so the accusative article is ''einen'' not ''ein'''
      type: object
      required:
      - original
      - corrected
      - explanation
      title: TurnCorrection
      description: A single language error identified across the session.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WritingEvaluationRequest:
      properties:
        user_id:
          type: integer
          title: User Id
          examples:
          - 42
        exercise_id:
          type: integer
          title: Exercise Id
          examples:
          - 7
        exercise_type:
          type: string
          title: Exercise Type
          description: Type of the exercise being answered
          examples:
          - translation
        question:
          type: string
          title: Question
          description: The original exercise question shown to the learner
          examples:
          - 'Translate: ''I would like a coffee, please'''
        expected_answer:
          type: string
          title: Expected Answer
          description: The canonical correct answer
          examples:
          - Je voudrais un cafe, s'il vous plait
        user_answer:
          type: string
          title: User Answer
          description: The learner's submitted written answer
          examples:
          - Je voudrai un cafe s'il vous plait
        target_language:
          type: string
          title: Target Language
          examples:
          - French
        level:
          type: string
          title: Level
          examples:
          - A2
      type: object
      required:
      - user_id
      - exercise_id
      - exercise_type
      - question
      - expected_answer
      - user_answer
      - target_language
      - level
      title: WritingEvaluationRequest
      description: 'Request body for evaluating a learner''s written answer against
        an exercise.

        Maps directly to the UserAnswer + Exercise domain objects in the Java backend.'
    WritingEvaluationResponse:
      properties:
        score:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Score
          description: Numeric score 0-10, maps to UserAnswer.score
          examples:
          - 6.5
        is_correct:
          type: boolean
          title: Is Correct
          description: True if the answer is substantially correct
        message:
          type: string
          maxLength: 254
          title: Message
          description: Brief feedback including what was wrong and why. Must be shorter
            than 255 characters because it maps to Feedback.message.
          examples:
          - Good attempt. Use the conditional 'voudrais' and include the accent in
            'cafe'.
        weak_area:
          type: string
          title: Weak Area
          description: Short grammatical or lexical category to improve
          examples:
          - accents and diacritics
        corrected_answer:
          type: string
          maxLength: 254
          title: Corrected Answer
          description: The corrected version of the learner's answer
          examples:
          - Je voudrais un cafe, s'il vous plait
      type: object
      required:
      - score
      - is_correct
      - message
      - weak_area
      - corrected_answer
      title: WritingEvaluationResponse
      description: 'AI evaluation of a written answer.

        score maps to UserAnswer.score; message and weak_area map directly to

        the Feedback entity (Feedback.message, Feedback.weakArea) in the backend.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
