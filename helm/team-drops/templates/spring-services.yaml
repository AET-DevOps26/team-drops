{{- range $key, $service := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  labels:
    {{- include "team-drops.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "team-drops.selectorLabels" (dict "Release" $.Release "component" $service.name) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  labels:
    {{- include "team-drops.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ $service.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $.Values.rollout.maxSurge }}
      maxUnavailable: {{ $.Values.rollout.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "team-drops.selectorLabels" (dict "Release" $.Release "component" $service.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-drops.labels" $ | nindent 8 }}
        {{- include "team-drops.selectorLabels" (dict "Release" $.Release "component" $service.name) | nindent 8 }}
    spec:
      {{- include "team-drops.imagePullSecrets" $ | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres {{ $.Values.postgres.port }}; do echo "waiting for postgres"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: {{ $service.name }}
          image: {{ include "team-drops.image" (dict "root" $ "image" $service.image) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: app
              containerPort: {{ $service.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: team-drops-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: team-drops-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team-drops-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: team-drops-config
                  key: AUTH_ENABLED
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: team-drops-config
                  key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: team-drops-config
                  key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
            - name: GENAI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: team-drops-config
                  key: GENAI_SERVICE_URL
            - name: LEARNING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: team-drops-config
                  key: LEARNING_SERVICE_URL
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: team-drops-config
                  key: USER_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: app
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health
              port: app
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: app
            timeoutSeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml $service.resources | nindent 12 }}
---
{{- end }}
