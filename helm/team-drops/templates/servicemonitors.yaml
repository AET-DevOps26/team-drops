{{- if .Values.monitoring.rancherServiceMonitors.enabled }}
{{- range $key, $service := .Values.services }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $service.name }}
  labels:
    {{- include "team-drops.labels" $ | nindent 4 }}
    app.kubernetes.io/component: monitoring
    {{- with $.Values.monitoring.rancherServiceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "team-drops.selectorLabels" (dict "Release" $.Release "component" $service.name) | nindent 6 }}
      monitoring: "true"
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ $.Values.monitoring.rancherServiceMonitors.interval | quote }}
      scrapeTimeout: {{ $.Values.monitoring.rancherServiceMonitors.scrapeTimeout | quote }}
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: genai-service
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    {{- with .Values.monitoring.rancherServiceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "genai-service") | nindent 6 }}
      monitoring: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.rancherServiceMonitors.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.rancherServiceMonitors.scrapeTimeout | quote }}
{{- end }}
