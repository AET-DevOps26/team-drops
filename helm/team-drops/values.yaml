image:
  registry: ghcr.io
  owner: aet-devops26
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

rollout:
  maxSurge: 0
  maxUnavailable: 1

auth:
  enabled: true
  # Public issuer URL expected in browser-issued tokens.
  issuerUri: ""
  # Internal/service JWKS URL used by backends to fetch signing keys.
  jwksUri: ""
  audience: ""
  clientId: team-drops
  clientSecret: ""

keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.0
  adminUsername: admin
  adminPassword: admin
  realm: team-drops
  theme: interviewmate
  port: 8080
  redirectUris:
    - http://localhost:3000/*
  webOrigins:
    - "+"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

oauth2Proxy:
  enabled: false
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  replicaCount: 1
  port: 4180
  cookieSecret: ""
  clientId: team-drops
  clientSecret: ""
  issuerUrl: ""
  redirectUrl: ""
  cookieSecure: true
  emailDomains:
    - "*"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

frontend:
  replicaCount: 1
  port: 80
  image: team-drops-frontend
  keycloakUrl: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

services:
  user:
    name: user-service
    image: team-drops-user-service
    replicaCount: 1
    port: 8081
    pathPrefix: /user-service
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 384Mi
  learning:
    name: learning-service
    image: team-drops-learning-service
    replicaCount: 1
    port: 8082
    pathPrefix: /learning-service
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 384Mi
  progress:
    name: progress-feedback-service
    image: team-drops-progress-feedback-service
    replicaCount: 1
    port: 8083
    pathPrefix: /progress-service
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 384Mi

genai:
  replicaCount: 1
  image: team-drops-genai-service
  port: 8084
  llmProvider: openai
  llmApiKey: ""
  llmModel: ""
  llmBaseUrl: ""
  ollamaBaseUrl: ""
  ollamaModel: llama3
  sttProvider: local
  whisperModel: base
  whisperDevice: cpu
  ttsEnabled: true
  prewarmModels: false
  kokoroModelPath: ""
  kokoroVoicesPath: ""
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

postgres:
  image: postgres:16
  username: postgres
  password: postgres
  database: teamdrops
  port: 5432
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 384Mi

mongo:
  image: mongo:7
  port: 27017
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 384Mi

ollama:
  enabled: false
  image: ollama/ollama:latest
  port: 11434
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

ingress:
  enabled: true
  host: ""
  className: ""
  tls:
    enabled: false
    secretName: team-drops-tls
    clusterIssuer: letsencrypt-staging
