{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
data:
  realm.json: |
    {
      "realm": {{ .Values.keycloak.realm | quote }},
      "enabled": true,
      "registrationAllowed": true,
      "clients": [
        {
          "clientId": {{ .Values.auth.clientId | quote }},
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "redirectUris": {{ toJson .Values.keycloak.redirectUris }},
          "webOrigins": {{ toJson .Values.keycloak.webOrigins }},
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  selector:
    {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "keycloak") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.keycloak.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-drops.labels" . | nindent 8 }}
        {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "keycloak") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres {{ .Values.postgres.port }}; do echo "waiting for postgres"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          args:
            - start
            - --import-realm
          ports:
            - name: http
              containerPort: {{ .Values.keycloak.port }}
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.adminUsername | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team-drops-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HOSTNAME
              value: {{ include "team-drops.keycloakPublicUrl" . | quote }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "postgres"
            - name: KC_DB_URL_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: team-drops-secret
                  key: POSTGRES_DB
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: team-drops-secret
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team-drops-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: keycloak-realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: keycloak-realm
          configMap:
            name: keycloak-realm
{{- end }}
