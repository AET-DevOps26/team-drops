{{- if eq .Release.Namespace .Values.application.namespace }}
{{- fail "the monitoring release namespace must differ from application.namespace" }}
{{- end }}
{{- if ne .Values.application.namespace "team-drops" }}
{{- fail "application.namespace must remain team-drops because the bundled rules and dashboard target that namespace" }}
{{- end }}
{{- if .Values.monitoring.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-drops-monitoring
  labels:
    {{- include "team-drops-monitoring.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.monitoring.resourceQuota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-drops-monitoring-defaults
  labels:
    {{- include "team-drops-monitoring.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.monitoring.limitRange.default.cpu | quote }}
        memory: {{ .Values.monitoring.limitRange.default.memory | quote }}
      defaultRequest:
        cpu: {{ .Values.monitoring.limitRange.defaultRequest.cpu | quote }}
        memory: {{ .Values.monitoring.limitRange.defaultRequest.memory | quote }}
{{- end }}
