          items:
            $ref: '#/components/schemas/GeneratedExercise'
          type: array
          title: Exercises
          description: Newly generated exercises in the same style as the provided examples
      type: object
      required:
        - exercises
      title: GenerateExercisesResponse
      description: >-
        Response body containing newly generated exercises.

        Each exercise matches the style and difficulty of the provided reference
        set.
    GeneratedExercise:
      properties:
        lesson_id:
          type: integer
          title: Lesson Id
          description: Lesson this exercise belongs to — passed through from the request
        type:
          type: string
          enum:
            - translation
            - fill-in-the-blank
            - multiple-choice
            - sentence-building
          title: Type
          description: Exercise type — maps to Exercise.type
        question:
          type: string
          title: Question
          description: The exercise prompt — maps to Exercise.question
        difficulty:
          type: string
          title: Difficulty
          description: Difficulty level — maps to Exercise.difficulty
        expected_answer:
          type: string
          title: Expected Answer
          description: The correct answer — maps to Exercise.expectedAnswer
      type: object
      required:
        - lesson_id
        - type
        - question
        - difficulty
        - expected_answer
      title: GeneratedExercise
      description: >-
        A single AI-generated exercise. All fields map directly to Exercise in
        the backend.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ListeningGenerateRequest:
      properties:
        target_language:
          type: string
          title: Target Language
          description: Language the script and questions will be written in
          examples:
            - German
        level:
          type: string
          enum:
            - A1
            - A2
            - B1
            - B2
            - C1
            - C2
          title: Level
          description: >-
            CEFR level of the learner — controls script vocabulary and grammar
            complexity
          examples:
            - B1
        topic:
          anyOf:
            - type: string
            - type: 'null'
          title: Topic
          description: >-
            Optional topic hint for the script (e.g. 'job interview', 'travel').
            Defaults to everyday life when omitted.
          examples:
            - job interview
      type: object
      required:
        - target_language
        - level
      title: ListeningGenerateRequest
    ListeningGenerateResponse:
      properties:
        script:
          type: string
          title: Script
          description: The listening passage in the target language
        questions:
          items:
            $ref: '#/components/schemas/ListeningQuestion'
          type: array
          minItems: 1
          title: Questions
          description: Multiple-choice comprehension questions about the script
        script_audio_b64:
          type: string
          title: Script Audio B64
          description: Base64-encoded WAV of the script spoken aloud
      type: object
      required:
        - script
        - questions
        - script_audio_b64
      title: ListeningGenerateResponse
    ListeningOption:
      properties:
        text:
          type: string
          title: Text
          description: The option text shown to the learner
          examples:
            - Im Park
        is_correct:
          type: boolean
          title: Is Correct
          description: >-
            True if this is the correct answer — exactly one option per question
            is true
      type: object
      required:
        - text
        - is_correct
      title: ListeningOption
    ListeningQuestion:
      properties:
        question:
          type: string
          title: Question
          description: The question text in the target language
          examples:
            - Wo treffen sich die zwei Freunde?
        options:
          items:
            $ref: '#/components/schemas/ListeningOption'
          type: array
          maxItems: 4
          minItems: 4
          title: Options
          description: Exactly four answer options — exactly one must have is_correct=true
        explanation:
          type: string
          title: Explanation
          description: Why the correct answer is right — shown after the learner submits
          examples:
            - >-
              The text says 'treffen sich im Park', which means 'they meet in
              the park'.
      type: object
      required:
        - question
        - options
        - explanation
      title: ListeningQuestion
    RagCorpusResponse:
      properties:
        topic:
          type: string
          title: Topic
        pdf_count:
          type: integer
          title: Pdf Count
        chunk_count:
          type: integer
          title: Chunk Count
