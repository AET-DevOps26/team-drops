[project]
name = "genai-service"
version = "0.1.0"
description = "GenAI microservice for AI Language Learning"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pydantic-settings>=2.0.0",
    "PyJWT[crypto]>=2.10.1",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.3.0",
    "llama-index>=0.12.0",
    "pypdf>=5.0.0",
    "rank-bm25>=0.2.2",
    "faster-whisper>=1.1.0",
    "kokoro-onnx>=0.4.0",
    "huggingface-hub>=0.24.0",
    "python-multipart>=0.0.12",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "ruff>=0.4.0",
]
