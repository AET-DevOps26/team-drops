services:
  postgres:
    image: postgres:16
    container_name: team-drops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamdrops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d teamdrops" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: team-drops-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teamdrops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  learning-service:
    build:
      context: .
      dockerfile: backend/learning-service/Dockerfile
    container_name: learning-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teamdrops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  progress-feedback-service:
    build:
      context: .
      dockerfile: backend/progress-feedback-service/Dockerfile
    container_name: progress-feedback-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teamdrops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      LEARNING_SERVICE_URL: http://learning-service:8082
      GENAI_SERVICE_URL: http://genai-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      learning-service:
        condition: service_started
      genai-service:
        condition: service_started

  genai-service:
    build:
      context: ./genai
    container_name: genai-service
    ports:
      - "8084:8084"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      - mongo
      - ollama-pull

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      VITE_USER_SERVICE_URL: http://user-service:8081
      VITE_LEARNING_SERVICE_URL: http://learning-service:8082
      VITE_PROGRESS_SERVICE_URL: http://progress-feedback-service:8083
    depends_on:
      - user-service
      - learning-service
      - progress-feedback-service
      - genai-service

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD-SHELL", "ollama list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    command:
      - sh
      - -c
      - ollama pull ${OLLAMA_MODEL:-llama3.2:1b}
    restart: "no"

volumes:
  postgres_data:
  mongo_data:
  ollama_data:
