openapi: 3.1.0
info:
  title: Progress & Feedback Service API
  version: 1.0.0
servers:
  - url: http://localhost:8083
    description: Progress-Feedback Service
paths:
  /api/v1/answers:
    post:
      tags:
        - Progress & Feedback Service
      summary: Submit answer
      operationId: submitAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Answer submitted and scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAnswerResponse'
        '400':
          $ref: '../base.yaml#/components/responses/BadRequest'
      x-service: progress-feedback-service
  /api/v1/progress/user/{user_id}:
    get:
      tags:
        - Progress & Feedback Service
      summary: Get progress by user ID
      operationId: getProgressByUserId
      parameters:
        - $ref: '../base.yaml#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User progress found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: progress-feedback-service
components:
  schemas:
    SubmitAnswerRequest:
      type: object
      required:
        - user_id
        - exercise_id
        - answer_text
      properties:
        user_id:
          type: integer
          format: int64
          example: 1
        exercise_id:
          type: integer
          format: int64
          example: 1
        answer_text:
          type: string
          minLength: 1
          example: I am a computer science student interested in backend development.
    UserAnswerResponse:
      type: object
      required:
        - id
        - user_id
        - exercise_id
        - answer_text
        - score
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        exercise_id:
          type: integer
          format: int64
          example: 1
        answer_text:
          type: string
          example: I am a computer science student interested in backend development.
        score:
          type: number
          format: double
          example: 0.85
    ProgressResponse:
      type: object
      required:
        - id
        - user_id
        - completed_exercises
        - total_exercises
        - average_score
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        completed_exercises:
          type: integer
          format: int32
          example: 4
        total_exercises:
          type: integer
          format: int32
          example: 10
        average_score:
          type: number
          format: double
          example: 0.78
