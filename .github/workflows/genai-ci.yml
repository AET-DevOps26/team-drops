name: GenAI CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'genai/**'
      - '!**/*.md'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: genai
        run: uv sync --frozen

      - name: Run tests
        working-directory: genai
        run: uv run pytest tests/ -v

  build-docker-image:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build genai-service Docker image
        run: docker build -t genai-service ./genai
