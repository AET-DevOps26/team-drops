image:
  registry: ghcr.io
  owner: aet-devops26
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

rollout:
  maxSurge: 0
  maxUnavailable: 1

monitoring:
  applicationVersionFallback: unknown
  rancherServiceMonitors:
    enabled: true
    labels:
      release: rancher-monitoring
    interval: 30s
    scrapeTimeout: 10s
  standalone:
    enabled: false
    namespace: team-drops
    grafanaAdminUser: admin
    grafanaAdminPassword: ""

prometheus:
  rbac:
    create: false
  serviceAccounts:
    server:
      create: false
      name: team-drops-prometheus
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  scrapeConfigs:
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
  configmapReload:
    prometheus:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
  server:
    fullnameOverride: team-drops-prometheus-server
    retention: 7d
    persistentVolume:
      enabled: true
      accessModes: [ReadWriteOnce]
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
  serverFiles:
    prometheus.yml:
      scrape_configs:
        - job_name: team-drops-services
          kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names: [team-drops]
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_label_monitoring]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_endpoint_port_name]
              action: keep
              regex: http
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              target_label: __metrics_path__
              action: replace
            - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
              target_label: service
              action: replace
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
              action: replace

grafana:
  fullnameOverride: team-drops-grafana
  initChownData:
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 20m
        memory: 32Mi
  rbac:
    create: true
    namespaced: true
  testFramework:
    enabled: false
  admin:
    existingSecret: team-drops-secret
    userKey: GRAFANA_ADMIN_USER
    passwordKey: GRAFANA_ADMIN_PASSWORD
  persistence:
    enabled: true
    type: pvc
    accessModes: [ReadWriteOnce]
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://team-drops-prometheus-server
          access: proxy
          isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: Team Drops
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: team-drops-grafana-dashboards

auth:
  enabled: true
  # Public issuer URL expected in browser-issued tokens.
  issuerUri: ""
  # Internal/service JWKS URL used by backends to fetch signing keys.
  jwksUri: ""
  audience: ""
  clientId: team-drops
  clientSecret: ""

keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.0
  adminUsername: admin
  adminPassword: admin
  realm: team-drops
  theme: interviewmate
  port: 8080
  redirectUris:
    - http://localhost:3000/*
  webOrigins:
    - "+"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

oauth2Proxy:
  enabled: false
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  replicaCount: 1
  port: 4180
  cookieSecret: ""
  clientId: team-drops
  clientSecret: ""
  issuerUrl: ""
  redirectUrl: ""
  cookieSecure: true
  emailDomains:
    - "*"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

frontend:
  replicaCount: 1
  port: 80
  image: team-drops-frontend
  keycloakUrl: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

services:
  user:
    name: user-service
    image: team-drops-user-service
    replicaCount: 1
    port: 8081
    pathPrefix: /user-service
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 384Mi
  learning:
    name: learning-service
    image: team-drops-learning-service
    replicaCount: 1
    port: 8082
    pathPrefix: /learning-service
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 384Mi
  progress:
    name: progress-feedback-service
    image: team-drops-progress-feedback-service
    replicaCount: 1
    port: 8083
    pathPrefix: /progress-service
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 384Mi

genai:
  replicaCount: 1
  image: team-drops-genai-service
  port: 8084
  llmProvider: openai
  llmApiKey: ""
  llmModel: ""
  llmBaseUrl: ""
  ollamaBaseUrl: ""
  ollamaModel: llama3
  sttProvider: local
  whisperModel: base
  whisperDevice: cpu
  ttsEnabled: true
  prewarmModels: false
  kokoroModelPath: ""
  kokoroVoicesPath: ""
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

postgres:
  image: postgres:16
  username: postgres
  password: postgres
  database: teamdrops
  port: 5432
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 384Mi

mongo:
  image: mongo:7
  port: 27017
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 384Mi

ollama:
  enabled: false
  image: ollama/ollama:latest
  port: 11434
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

ingress:
  enabled: true
  host: ""
  className: ""
  tls:
    enabled: false
    secretName: team-drops-tls
    clusterIssuer: letsencrypt-staging
