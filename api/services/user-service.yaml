openapi: 3.1.0
info:
  title: User Service API
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: User Service
security:
  - bearerAuth: []
paths:
  /api/v1/users/me:
    get:
      tags:
        - User Service
      summary: Get or create current OIDC user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user found or created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '../base.yaml#/components/responses/Unauthorized'
      x-service: user-service
  /api/v1/users/{user_id}:
    get:
      tags:
        - User Service
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - $ref: '../base.yaml#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: user-service
  /api/v1/users/{user_id}/profile:
    put:
      tags:
        - User Service
      summary: Create or update user profile
      operationId: upsertUserProfile
      parameters:
        - $ref: '../base.yaml#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserProfileRequest'
      responses:
        '200':
          description: User profile saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '../base.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: user-service
    post:
      tags:
        - User Service
      summary: Create user profile
      operationId: createUserProfile
      parameters:
        - $ref: '../base.yaml#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
      responses:
        '201':
          description: User profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '../base.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: user-service
    get:
      tags:
        - User Service
      summary: Get user profile
      operationId: getUserProfile
      parameters:
        - $ref: '../base.yaml#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '404':
          $ref: '../base.yaml#/components/responses/NotFound'
      x-service: user-service
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserResponse:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        new_user:
          type: boolean
          description: True only when this request created the local application user.
          default: false
    CreateUserProfileRequest:
      type: object
      required:
        - target_language
        - current_level
        - learning_goal
      properties:
        target_language:
          type: string
          minLength: 1
          example: English
        current_level:
          type: string
          minLength: 1
          example: B1
        learning_goal:
          type: string
          minLength: 1
          example: Prepare for a software engineering job interview
    UpsertUserProfileRequest:
      type: object
      required:
        - name
        - country
        - target_language
        - current_level
        - learning_goal
      properties:
        name:
          type: string
          minLength: 1
          example: Ada Lovelace
        country:
          type: string
          minLength: 1
          example: Germany
        target_language:
          type: string
          minLength: 1
          example: German
        current_level:
          type: string
          minLength: 1
          example: A2
        learning_goal:
          type: string
          minLength: 1
          example: Prepare for a software engineering job interview
    UserProfileResponse:
      type: object
      required:
        - id
        - user_id
        - name
        - country
        - target_language
        - current_level
        - learning_goal
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Ada Lovelace
        country:
          type: string
          example: Germany
        target_language:
          type: string
          example: German
        current_level:
          type: string
          example: A2
        learning_goal:
          type: string
          example: Prepare for a software engineering job interview
