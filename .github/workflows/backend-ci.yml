name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  openapi-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli lint --config redocly.yaml api/openapi.yaml

  build-backend-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle wrappers executable
        run: |
          chmod +x backend/user-service/gradlew
          chmod +x backend/learning-service/gradlew
          chmod +x backend/progress-feedback-service/gradlew

      - name: Build user-service
        working-directory: backend/user-service
        run: ./gradlew build -x test

      - name: Build learning-service
        working-directory: backend/learning-service
        run: ./gradlew build -x test

      - name: Build progress-feedback-service
        working-directory: backend/progress-feedback-service
        run: ./gradlew build -x test

  build-docker-images:
    runs-on: ubuntu-latest
    needs: build-backend-services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build user-service Docker image
        run: docker build -t user-service ./backend/user-service

      - name: Build learning-service Docker image
        run: docker build -t learning-service ./backend/learning-service

      - name: Build progress-feedback-service Docker image
        run: docker build -t progress-feedback-service ./backend/progress-feedback-service
