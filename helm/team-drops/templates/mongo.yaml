apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  selector:
    {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "mongo") | nindent 4 }}
  ports:
    - name: mongo
      port: {{ .Values.mongo.port }}
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "mongo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-drops.labels" . | nindent 8 }}
        {{- include "team-drops.selectorLabels" (dict "Release" .Release "component" "mongo") | nindent 8 }}
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: {{ .Values.mongo.port }}
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          {{- include "team-drops.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mongo.storage.size | quote }}
