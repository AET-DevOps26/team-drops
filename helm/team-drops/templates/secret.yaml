apiVersion: v1
kind: Secret
metadata:
  name: team-drops-secret
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (eq (lower .Values.genai.llmProvider) "openai") (not .Values.genai.llmApiKey) }}
  {{- fail "genai.llmApiKey is required when genai.llmProvider=openai" }}
  {{- end }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.password | quote }}
  LLM_API_KEY: {{ .Values.genai.llmApiKey | quote }}
