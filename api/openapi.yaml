openapi: 3.1.0
info:
  title: Language Learning Platform API
  description: |
    Initial API contract for the job interview preparation scenario.

    **Naming conventions**
    - API JSON / OpenAPI: `snake_case` (e.g. `lesson_id`, `expected_answer`)
    - Java entity fields: `camelCase` (e.g. `lessonId`, `expectedAnswer`)
    - Database columns: `snake_case` via `@Column(name = ...)`

    Service ownership is indicated per-operation via `x-service`.
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: User Service
  - url: http://localhost:8082
    description: Learning Service
  - url: http://localhost:8083
    description: Progress-Feedback Service
  - url: http://localhost:8084
    description: GenAI Service
tags:
  - name: User Service
    description: User and profile APIs
    x-displayName: User Service
  - name: Learning Service
    description: Learning plan, lesson, and exercise APIs
    x-displayName: Learning Service
  - name: Progress & Feedback Service
    description: Answer submission and progress APIs
    x-displayName: Progress & Feedback Service
  - name: GenAI Service
    description: GenAI APIs
    x-displayName: GenAI Service
  - name: exercises
    x-displayName: exercises
  - name: writing
    x-displayName: writing
  - name: ops
    x-displayName: ops
paths:
  /api/v1/users:
    post:
      tags:
        - User Service
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      x-service: user-service
  /api/v1/users/{id}:
    get:
      tags:
        - User Service
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: user-service
  /api/v1/users/{id}/profile:
    post:
      tags:
        - User Service
      summary: Create user profile
      operationId: createUserProfile
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
      responses:
        '201':
          description: User profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: user-service
    get:
      tags:
        - User Service
      summary: Get user profile
      operationId: getUserProfile
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: user-service
  /api/v1/answers:
    post:
      tags:
        - Progress & Feedback Service
      summary: Submit answer
      operationId: submitAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Answer submitted and scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-service: progress-feedback-service
  /api/v1/progress/user/{user_id}:
    get:
      tags:
        - Progress & Feedback Service
      summary: Get progress by user ID
      operationId: getProgressByUserId
      parameters:
        - $ref: '#/components/parameters/UserIdPathByName'
      responses:
        '200':
          description: User progress found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: progress-feedback-service
  /api/v1/learning-plans/default:
    post:
      tags:
        - Learning Service
      summary: Create default job interview learning plan
      operationId: createDefaultLearningPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDefaultLearningPlanRequest'
      responses:
        '201':
          description: Default learning plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-service: learning-service
  /api/v1/learning-plans/user/{user_id}:
    get:
      tags:
        - Learning Service
      summary: Get learning plans by user ID
      operationId: getLearningPlansByUserId
      parameters:
        - $ref: '#/components/parameters/UserIdPathByName'
      responses:
        '200':
          description: Learning plans found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningPlanResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: learning-service
  /api/v1/lessons/{lesson_id}:
    get:
      tags:
        - Learning Service
      summary: Get lesson by ID
      operationId: getLessonById
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      responses:
        '200':
          description: Lesson found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: learning-service
  /api/v1/genai/exercises/generate:
    post:
      tags:
        - exercises
      summary: Generate additional exercises
      description: >-
        Given a lesson topic and a set of existing exercises as style
        references, generate new exercises using AI. The AI matches the format,
        difficulty, and exercise types of the provided reference set.
      operationId: generateExercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateExercisesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateExercisesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-service: genai-service
  /api/v1/genai/writing/evaluate:
    post:
      tags:
        - writing
      summary: Evaluate a written answer
      description: >-
        Evaluate a learner's written answer against the exercise's expected
        answer. Returns a numeric score (0–10) ready to store as
        UserAnswer.score, plus message and weak_area fields that map directly to
        a Feedback record. Also returns the corrected answer and a detailed
        explanation of errors.
      operationId: evaluateWriting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritingEvaluationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WritingEvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-service: genai-service
  /health:
    get:
      tags:
        - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: integer
        format: int64
    UserIdPathByName:
      name: user_id
      in: path
      required: true
      description: User ID
      schema:
        type: integer
        format: int64
    LessonIdPath:
      name: lesson_id
      in: path
      required: true
      description: Lesson ID
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request data
        details:
          type: string
          example: email must be valid
    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          example: Ada Lovelace
        email:
          type: string
          format: email
          minLength: 1
          example: ada@example.com
        password:
          type: string
          minLength: 1
          format: password
          example: secure-password
    UserResponse:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
    CreateUserProfileRequest:
      type: object
      required:
        - target_language
        - current_level
        - learning_goal
      properties:
        target_language:
          type: string
          minLength: 1
          example: English
        current_level:
          type: string
          minLength: 1
          example: B1
        learning_goal:
          type: string
          minLength: 1
          example: Prepare for a software engineering job interview
    UserProfileResponse:
      type: object
      required:
        - id
        - user_id
        - target_language
        - current_level
        - learning_goal
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        target_language:
          type: string
          example: English
        current_level:
          type: string
          example: B1
        learning_goal:
          type: string
          example: Prepare for a software engineering job interview
    SubmitAnswerRequest:
      type: object
      required:
        - user_id
        - exercise_id
        - answer_text
      properties:
        user_id:
          type: integer
          format: int64
          example: 1
        exercise_id:
          type: integer
          format: int64
          example: 1
        answer_text:
          type: string
          minLength: 1
          example: I am a computer science student interested in backend development.
    UserAnswerResponse:
      type: object
      required:
        - id
        - user_id
        - exercise_id
        - answer_text
        - score
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        exercise_id:
          type: integer
          format: int64
          example: 1
        answer_text:
          type: string
          example: I am a computer science student interested in backend development.
        score:
          type: number
          format: double
          example: 0.85
    ProgressResponse:
      type: object
      required:
        - id
        - user_id
        - completed_exercises
        - total_exercises
        - average_score
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        completed_exercises:
          type: integer
          format: int32
          example: 4
        total_exercises:
          type: integer
          format: int32
          example: 10
        average_score:
          type: number
          format: double
          example: 0.78
    CreateDefaultLearningPlanRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          format: int64
          example: 1
    LearningPlanResponse:
      type: object
      required:
        - id
        - user_id
        - title
        - description
        - lessons
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Job Interview Preparation
        description:
          type: string
          example: A default plan for practicing job interview conversations.
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonResponse'
    LessonResponse:
      type: object
      required:
        - id
        - plan_id
        - title
        - topic
        - order_number
        - exercises
      properties:
        id:
          type: integer
          format: int64
          example: 1
        plan_id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Introducing Yourself
        topic:
          type: string
          example: Interview introduction
        order_number:
          type: integer
          format: int32
          example: 1
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseResponse'
    ExerciseResponse:
      type: object
      required:
        - id
        - lesson_id
        - type
        - question
        - difficulty
        - expected_answer
      properties:
        id:
          type: integer
          format: int64
          example: 1
        lesson_id:
          type: integer
          format: int64
          example: 1
        type:
          type: string
          example: free_text
        question:
          type: string
          example: Tell me about yourself.
        difficulty:
          type: string
          example: beginner
        expected_answer:
          type: string
          example: A concise summary of experience, strengths, and motivation.
    ExerciseContext:
      properties:
        type:
          type: string
          title: Type
          description: >-
            Exercise type, e.g. 'translation', 'fill-in-the-blank',
            'multiple-choice'
          examples:
            - translation
        question:
          type: string
          title: Question
          description: The exercise prompt shown to the learner
          examples:
            - 'Translate: ''The cat is on the table'''
        difficulty:
          type: string
          title: Difficulty
          examples:
            - beginner
        expected_answer:
          anyOf:
            - type: string
            - type: 'null'
          title: Expected Answer
          examples:
            - Die Katze ist auf dem Tisch
      type: object
      required:
        - type
        - question
        - difficulty
      title: ExerciseContext
      description: An existing exercise provided as a style/difficulty reference.
    GenerateExercisesRequest:
      properties:
        lesson_id:
          type: integer
          title: Lesson Id
          description: >-
            ID of the lesson these exercises belong to — passed through to each
            generated exercise
          examples:
            - 3
        lesson_topic:
          type: string
          title: Lesson Topic
          description: Topic or theme of the lesson
          examples:
            - Everyday household items
        target_language:
          type: string
          title: Target Language
          description: Language being learned (full name or BCP-47 tag)
          examples:
            - German
        level:
          type: string
          title: Level
          description: CEFR level or descriptive level of the learner
          examples:
            - A2
        existing_exercises:
          items:
            $ref: '#/components/schemas/ExerciseContext'
          type: array
          maxItems: 5
          minItems: 1
          title: Existing Exercises
          description: 1–5 existing exercises to use as style and difficulty references
        count:
          type: integer
          maximum: 10
          minimum: 1
          title: Count
          description: Number of new exercises to generate
          default: 3
          examples:
            - 3
      type: object
      required:
        - lesson_id
        - lesson_topic
        - target_language
        - level
        - existing_exercises
      title: GenerateExercisesRequest
      description: >-
        Request body for generating additional exercises similar to existing
        ones.

        Provide 1–5 existing exercises as style references — the AI will match
        their

        format, difficulty, and language level when creating new ones.
    GenerateExercisesResponse:
      properties:
        exercises:
          items:
            $ref: '#/components/schemas/GeneratedExercise'
          type: array
          title: Exercises
          description: Newly generated exercises in the same style as the provided examples
      type: object
      required:
        - exercises
      title: GenerateExercisesResponse
      description: >-
        Response body containing newly generated exercises.

        Each exercise matches the style and difficulty of the provided reference
        set.
    GeneratedExercise:
      properties:
        lesson_id:
          type: integer
          title: Lesson Id
          description: Lesson this exercise belongs to — passed through from the request
        type:
          type: string
          enum:
            - translation
            - fill-in-the-blank
            - multiple-choice
            - sentence-building
          title: Type
          description: Exercise type — maps to Exercise.type
        question:
          type: string
          title: Question
          description: The exercise prompt — maps to Exercise.question
        difficulty:
          type: string
          title: Difficulty
          description: Difficulty level — maps to Exercise.difficulty
        expected_answer:
          type: string
          title: Expected Answer
          description: The correct answer — maps to Exercise.expectedAnswer
      type: object
      required:
        - lesson_id
        - type
        - question
        - difficulty
        - expected_answer
      title: GeneratedExercise
      description: >-
        A single AI-generated exercise. All fields map directly to Exercise in
        the backend.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    WritingEvaluationRequest:
      properties:
        user_id:
          type: integer
          title: User Id
          examples:
            - 42
        exercise_id:
          type: integer
          title: Exercise Id
          examples:
            - 7
        exercise_type:
          type: string
          title: Exercise Type
          description: Type of the exercise being answered
          examples:
            - translation
        question:
          type: string
          title: Question
          description: The original exercise question shown to the learner
          examples:
            - 'Translate: ''I would like a coffee, please'''
        expected_answer:
          type: string
          title: Expected Answer
          description: The canonical correct answer
          examples:
            - Je voudrais un café, s'il vous plaît
        user_answer:
          type: string
          title: User Answer
          description: The learner's submitted written answer
          examples:
            - Je voudrai un cafe s'il vous plait
        target_language:
          type: string
          title: Target Language
          examples:
            - French
        level:
          type: string
          title: Level
          examples:
            - A2
      type: object
      required:
        - user_id
        - exercise_id
        - exercise_type
        - question
        - expected_answer
        - user_answer
        - target_language
        - level
      title: WritingEvaluationRequest
      description: >-
        Request body for evaluating a learner's written answer against an
        exercise.

        Maps directly to the UserAnswer + Exercise domain objects in the Java
        backend.
    WritingEvaluationResponse:
      properties:
        score:
          type: number
          maximum: 10
          minimum: 0
          title: Score
          description: Numeric score 0–10 — maps to UserAnswer.score
          examples:
            - 6.5
        is_correct:
          type: boolean
          title: Is Correct
          description: True if the answer is substantially correct
        message:
          type: string
          title: Message
          description: >-
            Full feedback including what was wrong and why — maps to
            Feedback.message. Should be a complete, helpful explanation suitable
            for storing as the feedback record.
          examples:
            - >-
              Good attempt! 'voudrais' needs a conditional ending (-ais not
              -ai), and French requires accents: 'café' not 'cafe'. Otherwise
              the structure is correct.
        weak_area:
          type: string
          title: Weak Area
          description: >-
            Short grammatical/lexical category to improve — maps to
            Feedback.weakArea
          examples:
            - accents and diacritics
        corrected_answer:
          type: string
          title: Corrected Answer
          description: The corrected version of the learner's answer — for frontend display
          examples:
            - Je voudrais un café, s'il vous plaît
      type: object
      required:
        - score
        - is_correct
        - message
        - weak_area
        - corrected_answer
      title: WritingEvaluationResponse
      description: >-
        AI evaluation of a written answer.

        score maps to UserAnswer.score; message and weak_area map directly to

        the Feedback entity (Feedback.message, Feedback.weakArea) in the
        backend.
