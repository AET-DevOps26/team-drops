name: GenAI CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'genai/**'
      - 'RAG/**'
      - 'api/**'
      - '.github/workflows/genai-ci.yml'
      - '!**/*.md'

  push:
    branches: [main]
    paths:
      - 'genai/**'
      - 'RAG/**'
      - 'api/**'
      - '.github/workflows/genai-ci.yml'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: genai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v --junitxml=test-results/junit.xml

      - name: Upload GenAI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genai-test-report
          path: genai/test-results/junit.xml
          if-no-files-found: error

  sync-openapi:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install GenAI dependencies
        working-directory: genai
        run: uv sync

      - name: Export GenAI spec and rebuild central spec
        run: bash api/scripts/export_openapi.sh

      - name: Fail if GenAI spec is out of sync
        run: |
          git diff --exit-code api/services/genai.yaml || \
            (echo "ERROR: api/services/genai.yaml is stale. Run: bash api/scripts/export_openapi.sh and commit the result." && exit 1)

      - name: Fail if central spec is out of sync
        run: |
          git diff --exit-code api/openapi.yaml || \
            (echo "ERROR: api/openapi.yaml is stale. Run: bash api/scripts/export_openapi.sh and commit the result." && exit 1)

      - name: Lint central OpenAPI spec
        run: npx --yes @redocly/cli lint api/openapi.yaml --config api/redocly.yaml

  build-docker-image:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: sync-openapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t genai-service -f genai/Dockerfile .
