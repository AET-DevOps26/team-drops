apiVersion: v1
kind: Secret
metadata:
  name: team-drops-secret
  labels:
    {{- include "team-drops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (eq (lower .Values.genai.llmProvider) "openai") (not .Values.genai.llmApiKey) }}
  {{- fail "genai.llmApiKey is required when genai.llmProvider=openai" }}
  {{- end }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.password | quote }}
  LLM_API_KEY: {{ .Values.genai.llmApiKey | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.auth.clientSecret | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  OAUTH2_PROXY_CLIENT_SECRET: {{ default .Values.auth.clientSecret .Values.oauth2Proxy.clientSecret | quote }}
  OAUTH2_PROXY_COOKIE_SECRET: {{ .Values.oauth2Proxy.cookieSecret | quote }}
  {{- if .Values.monitoring.standalone.enabled }}
  {{- if not .Values.monitoring.standalone.grafanaAdminPassword }}
  {{- fail "monitoring.standalone.grafanaAdminPassword is required when standalone monitoring is enabled" }}
  {{- end }}
  GRAFANA_ADMIN_USER: {{ .Values.monitoring.standalone.grafanaAdminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.monitoring.standalone.grafanaAdminPassword | quote }}
  {{- end }}
