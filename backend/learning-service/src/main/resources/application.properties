server.port=8082
spring.application.name=learning-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.ignore-migration-patterns=*:ignored

management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}

app.auth.enabled=${AUTH_ENABLED:false}
services.genai.base-url=${GENAI_SERVICE_URL:http://localhost:8084}
services.user.base-url=${USER_SERVICE_URL:http://localhost:8081}
