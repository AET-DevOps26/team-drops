services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamdrops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d teamdrops" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/team-drops-realm.json:ro
      - ./helm/team-drops/files/keycloak-theme/interviewmate:/opt/keycloak/themes/interviewmate:ro

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teamdrops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/team-drops}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/team-drops/protocol/openid-connect/certs}
    depends_on:
      postgres:
        condition: service_healthy

  learning-service:
    build:
      context: .
      dockerfile: backend/learning-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teamdrops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8081
      GENAI_SERVICE_URL: http://genai-service:8084
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SERVER_ERROR_INCLUDE_MESSAGE: ${SERVER_ERROR_INCLUDE_MESSAGE:-never}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/team-drops}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/team-drops/protocol/openid-connect/certs}
    depends_on:
      postgres:
        condition: service_healthy
      genai-service:
        condition: service_started

  progress-feedback-service:
    build:
      context: .
      dockerfile: backend/progress-feedback-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teamdrops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8081
      LEARNING_SERVICE_URL: http://learning-service:8082
      GENAI_SERVICE_URL: http://genai-service:8084
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SERVER_ERROR_INCLUDE_MESSAGE: ${SERVER_ERROR_INCLUDE_MESSAGE:-never}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/team-drops}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/team-drops/protocol/openid-connect/certs}
    depends_on:
      postgres:
        condition: service_healthy
      learning-service:
        condition: service_started
      genai-service:
        condition: service_started

  genai-service:
    build:
      context: .
      dockerfile: genai/Dockerfile
    ports:
      - "8084:8084"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-180}
      RAG_LEARNING_PLAN_MAX_REPAIR_ATTEMPTS: ${RAG_LEARNING_PLAN_MAX_REPAIR_ATTEMPTS:-3}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      MONGO_URL: mongodb://mongo:27017
      RAG_DOC_DB_PATH: /app/RAG doc DB
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/team-drops}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/team-drops/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      STT_PROVIDER: ${STT_PROVIDER:-local}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      TTS_ENABLED: ${TTS_ENABLED:-true}
      KOKORO_MODEL_PATH: ${KOKORO_MODEL_PATH:-}
      KOKORO_VOICES_PATH: ${KOKORO_VOICES_PATH:-}
      PREWARM_MODELS: ${PREWARM_MODELS:-false}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_ENABLED: ${AUTH_ENABLED:-false}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8090}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-team-drops}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-team-drops}
    ports:
      - "3000:80"
    environment:
      VITE_USER_SERVICE_URL: http://user-service:8081
      VITE_LEARNING_SERVICE_URL: http://learning-service:8082
      VITE_PROGRESS_SERVICE_URL: http://progress-feedback-service:8083
      VITE_AUTH_ENABLED: ${AUTH_ENABLED:-false}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8090}
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-team-drops}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-team-drops}
    depends_on:
      - user-service
      - learning-service
      - progress-feedback-service
      - genai-service

  ollama:
    image: ollama/ollama:latest
    profiles:
      - local-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD-SHELL", "ollama list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    profiles:
      - local-ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    entrypoint:
      - sh
      - -c
    command:
      - ollama pull "$${OLLAMA_MODEL:-qwen3:1.7b}"
    restart: "no"

volumes:
  postgres_data:
  mongo_data:
  ollama_data:
