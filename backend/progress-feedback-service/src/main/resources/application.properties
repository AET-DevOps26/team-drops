server.port=8083
spring.application.name=progress-feedback-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

services.learning.base-url=${LEARNING_SERVICE_URL:http://localhost:8082}
services.genai.base-url=${GENAI_SERVICE_URL:http://localhost:8084}

management.endpoints.web.exposure.include=health
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.auth.enabled=${AUTH_ENABLED:false}
